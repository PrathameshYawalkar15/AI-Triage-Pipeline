[project]
name = "ai-triage-pipeline"
version = "0.1.0"
description = "AI Release Risk & Root-Cause Triage Copilot with MCP, Agentic RAG, and LangGraph HITL"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7.0",
  "langgraph>=0.2.0",
  "langchain-ollama>=0.2.0",
  "mcp>=1.0.0",
  "streamlit>=1.38.0",
  "pytest>=8.0.0",
]

[project.optional-dependencies]
dev = [
  "robotframework>=7.0.0",
  "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]